{% extends 'base.html' %}
{% load static %}

{% block title %}Check Your Email — Handy Man{% endblock %}

{% block content %}
<div class="hm-status-page">
  <div class="hm-status-icon text-primary"><i class="fas fa-envelope-open-text"></i></div>
  <h2 class="hm-section-title">Check your email</h2>
  <p class="text-muted" style="max-width: 480px; margin: 0 auto;">
    We've sent you an email with a link to reset your password.
    If you don't see it, check your spam folder.
  </p>
  <a href="{% url 'handyman-login' %}" class="btn hm-btn-primary mt-3">Back to sign in</a>
</div>
{% endblock %}
