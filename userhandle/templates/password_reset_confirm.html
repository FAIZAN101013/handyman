{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Set New Password — Handy Man{% endblock %}

{% block content %}
<div class="card hm-auth-card">
  <div class="card-body p-4 p-md-5">
    <h2 class="hm-section-title mb-1">Set a new password</h2>
    <p class="text-muted mb-4">Choose a strong password for your account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn hm-btn-primary w-100 py-2 mt-2" type="submit">Set Password</button>
    </form>
  </div>
</div>
{% endblock %}
