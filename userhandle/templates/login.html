{% extends 'forms.html' %}
{% load static %}

{% block title %}Sign In — Handy Man{% endblock %}

{% block body %}
<div class="card hm-auth-card">
  <div class="card-body p-4 p-md-5">
    <h2 class="hm-section-title mb-1">Welcome back</h2>
    <p class="text-muted mb-4">Sign in with your email address</p>

    <form action="{% url 'handyman-login' %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="login-email">Email</label>
        <input class="form-control" type="email" id="login-email" placeholder="email@example.com" name="email" required />
      </div>
      <div class="mb-2">
        <label class="form-label" for="password-field">Password</label>
        <div class="position-relative">
          <input class="form-control pe-5" type="password" placeholder="********" id="password-field" name="password" required />
          <i toggle="#password-field"
             class="fa fa-fw fa-eye toggle-password position-absolute top-50 end-0 translate-middle-y me-3"
             style="cursor: pointer;"></i>
        </div>
      </div>
      <p class="pass-reset text-end mb-4" style="cursor: pointer;">
        <small>Forgot password?</small>
      </p>
      <button class="btn hm-btn-primary w-100 py-2" type="submit">Sign In</button>
      <p class="text-center mt-3 mb-0">
        <small>Don't have an account? <a href="{% url 'handyman-registration' %}">Sign up</a></small>
      </p>
    </form>
  </div>
</div>
{% endblock %}
