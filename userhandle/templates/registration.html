{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up — Handy Man{% endblock %}

{% block content %}
<div class="card hm-auth-card hm-auth-card-wide">
  <div class="card-body p-4 p-md-5">
    <h2 class="hm-section-title mb-1">Create your account</h2>
    <p class="text-muted mb-4">Join as a customer or a handyman — or both</p>

    <form action="{% url 'handyman-registration' %}" method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label" for="reg-firstname">First name</label>
          <input class="form-control" type="text" id="reg-firstname" name="firstname" required />
        </div>
        <div class="col-6">
          <label class="form-label" for="reg-lastname">Last name</label>
          <input class="form-control" type="text" id="reg-lastname" name="lastname" required />
        </div>
        <div class="col-12">
          <label class="form-label" for="reg-email">Email</label>
          <input class="form-control" type="email" id="reg-email" placeholder="email@example.com" name="email" required />
        </div>
        <div class="col-6">
          <label class="form-label" for="reg-contact">Contact</label>
          <input class="form-control" type="text" id="reg-contact" name="contact" />
        </div>
        <div class="col-6">
          <label class="form-label" for="reg-postcode">Postcode</label>
          <input class="form-control" type="text" id="reg-postcode" name="postcode" />
        </div>
        <div class="col-12">
          <label class="form-label" for="password-field">
            Password
            <i class="fa fa-info-circle ms-1"
               data-bs-toggle="tooltip"
               data-bs-placement="top"
               title="At least 8 characters, with a number, a capital letter, and a special character"
               style="float: none; margin: 0;"></i>
          </label>
          <div class="position-relative">
            <input class="form-control pe-5" type="password" placeholder="********" id="password-field" name="password1" required />
            <i toggle="#password-field"
               class="fa fa-fw fa-eye toggle-password position-absolute top-50 end-0 translate-middle-y me-3"
               style="cursor: pointer;"></i>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label" for="reg-password2">Re-enter password</label>
          <input class="form-control" type="password" placeholder="********" id="reg-password2" name="password2" required />
        </div>
        <div class="col-12">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="Checkbox-1" name="is_FixR" />
            <label class="form-check-label" for="Checkbox-1">I want to work</label>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="Checkbox-2" name="is_customer" />
            <label class="form-check-label" for="Checkbox-2">I want to hire</label>
          </div>
        </div>
      </div>
      <button class="btn hm-btn-primary w-100 py-2 mt-4" type="submit">Sign Up</button>
      <p class="text-center mt-3 mb-0">
        <small>Already have an account? <a href="{% url 'handyman-login' %}">Sign in</a></small>
      </p>
    </form>
  </div>
</div>

<script>
  new bootstrap.Tooltip(document.querySelector('[data-bs-toggle="tooltip"]'));
  $(".toggle-password").click(function () {
    $(this).toggleClass("fa-eye fa-eye-slash");
    var input = $($(this).attr("toggle"));
    input.attr("type", input.attr("type") == "password" ? "text" : "password");
  });
</script>
{% endblock %}
