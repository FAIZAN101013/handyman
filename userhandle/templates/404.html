{% extends 'forms.html' %}

{% block title %}Page Not Found — Handy Man{% endblock %}

{% block body %}
<div class="hm-status-page">
  <div class="hm-status-icon text-muted"><i class="fas fa-compass"></i></div>
  <h2 class="hm-section-title">Page not found</h2>
  <p class="text-muted">The page you're looking for doesn't exist or has moved.</p>
  {% if user.is_authenticated %}
    <a href="{% url 'index' %}" class="btn hm-btn-primary mt-2">Go back home</a>
  {% else %}
    <a href="{% url 'handyman-login' %}" class="btn hm-btn-primary mt-2">Go to sign in</a>
  {% endif %}
</div>
{% endblock %}
