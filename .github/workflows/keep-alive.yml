name: Keep Render service awake

# Render's free instances sleep after ~15 minutes idle, and the next visitor
# waits 30-60s for a cold start. Pinging every 10 minutes keeps it warm.
# Change SITE_URL below if the service URL changes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger a ping by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        env:
          SITE_URL: https://handymangunicorn-handyman-wsgi.onrender.com/home/
        run: |
          # --max-time is generous: a cold start can take close to a minute.
          status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 120 "$SITE_URL")
          echo "GET $SITE_URL -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200, got $status"
            exit 1
          fi
